name: Generate Gallery Thumbnails
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'pilot/img/**'
      - 'klagifornia/img/**'
      - '!**/img/thumbs/**'
      - 'scripts/gallery/**'

concurrency:
  group: gallery-thumbnails
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  thumbnails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system tools (ffmpeg, heif-convert, cwebp)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends ffmpeg libheif-examples webp
          ffmpeg -version | head -n 1

      - name: Convert raw uploads to WebP
        run: |
          for dir in pilot/img klagifornia/img; do
            [ -d "$dir" ] || continue
            # HEIC → PNG → WebP
            find "$dir" -maxdepth 1 \( -iname "*.heic" \) | while read -r f; do
              base="${f%.*}"
              heif-convert "$f" "${base}.png" \
                && cwebp -q 92 "${base}.png" -o "${base}.webp" \
                && rm -f "$f" "${base}.png" \
                && echo "Converted HEIC: $f → ${base}.webp" \
                || echo "WARNING: failed to convert $f"
            done
            # JPG / JPEG → WebP (skip if same-stem .webp already exists)
            find "$dir" -maxdepth 1 \( -iname "*.jpg" -o -iname "*.jpeg" \) | while read -r f; do
              base="${f%.*}"
              if [ ! -f "${base}.webp" ]; then
                cwebp -q 92 "$f" -o "${base}.webp" && rm -f "$f" \
                  && echo "Converted JPG: $f → ${base}.webp" \
                  || echo "WARNING: failed to convert $f"
              else
                rm -f "$f" && echo "Removed duplicate: $f (webp exists)"
              fi
            done
          done

      - name: Install dependencies
        run: npm install
        working-directory: scripts/gallery

      - name: Generate thumbnails and manifests
        run: node scripts/gallery/generate.mjs

      - name: Commit generated thumbnails & manifests
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- scripts/gallery/package-lock.json pilot/img klagifornia/img _data/galleries
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No gallery changes to commit."
          else
            git commit -m "chore(gallery): regenerate thumbnails & manifests"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A commit pushed with GITHUB_TOKEN does not trigger other workflows,
      # so explicitly dispatch the deploy workflow for the new bot commit.
      - name: Trigger Pages deploy for the regenerated content
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref master
