name: Compress Images on Push to main branch
run-name: Compress images on push to main @${{ github.actor }}
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '**.jpg'
      - '**.jpeg'
      - '**.png'
      - '**.webp'
      - '!**/img/thumbs/**'
permissions:
  contents: write
  pull-requests: write
  actions: write
# Pushes in quick succession only need one compression run (the latest).
concurrency:
  group: image-compression
  cancel-in-progress: true
jobs:
  build:
    name: calibreapp/image-actions
    runs-on: ubuntu-latest
    # Don't re-run on the push produced by merging a compression PR.
    if: >-
      !contains(github.event.head_commit.message, 'auto-compress-images') &&
      !contains(github.event.head_commit.message, 'Compressed Images')
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      # Remove branches left behind by earlier runs (e.g. a failed merge);
      # deleting a branch also closes its stale PR.
      - name: Cleanup old auto-compress-images branches
        run: |
          branches=$(git ls-remote --heads origin 'auto-compress-images*' | sed 's|.*refs/heads/||')
          if [ -n "$branches" ]; then
            git push origin --delete $branches
          else
            echo "no remote branches to cleanup"
          fi
      - name: Compress Images
        id: calibre
        uses: calibreapp/image-actions@main
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          compressOnly: true
          jpegQuality: '100'
          jpegProgressive: true
          pngQuality: '100'
          webpQuality: '100'
      - name: debug
        run: git status && git diff && git branch
      - name: Create New Pull Request If Needed
        id: cpr
        if: steps.calibre.outputs.markdown != ''
        uses: peter-evans/create-pull-request@v8
        with:
          title: Compressed Images
          branch: auto-compress-images
          branch-suffix: timestamp
          delete-branch: true
          commit-message: Compressed Images
          body: ${{ steps.calibre.outputs.markdown }}
      - name: Merge Pull Request
        id: merge
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" --squash --delete-branch
          echo "merged=true" >> "$GITHUB_OUTPUT"

      # A merge done with GITHUB_TOKEN does not trigger other workflows,
      # so explicitly dispatch the deploy workflow for the merged commit.
      - name: Trigger Pages deploy for the compressed images
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref master
